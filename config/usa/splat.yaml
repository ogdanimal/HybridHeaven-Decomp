name: Hybrid Heaven (USA)
sha1: 61ed3d5d5390c3c17b4026797b93be50a61dd6f2

options:
  basename: hybridheaven
  compiler: IDO
  platform: n64

  header_encoding: ASCII

  target_path: config/usa/baserom.decompressed.z64
  ld_script_path: .splat/usa/hybridheaven.ld
  elf_path: build/usa/hybridheaven.elf
  base_path: ../../

  undefined_funcs_auto_path: .splat/usa/undefined_funcs_auto.ld
  undefined_syms_auto_path: .splat/usa/undefined_syms_auto.ld

  symbol_addrs_path:
    - config/usa/symbol_addrs/symbol_addrs.txt
    - config/usa/symbol_addrs/libultra_syms.txt
  reloc_addrs_path:
    - config/usa/reloc_addrs/reloc_addrs.txt

  asm_path: asm/usa
  src_path: src
  build_path: build/usa
  asset_path: bin/usa

  symbol_name_format: $VRAM_$ROM

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  rodata_string_guesser_level: 2
  gfx_ucode: f3dex

  # This game's sections are packed with only 4-byte alignment. splat's default
  # `. = ALIGN(., 16)` after every section/segment inserts padding that shifts
  # the whole image, so turn both off.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  # subalign 4, not 16: the .text/ucode boundary at 0x35D30 is only
  # 4-byte aligned in the original, so forcing 16 inserts padding and shifts
  # the whole image.
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subalign: 4
    subsegments:
    - [0x1000, hasm, entry]

